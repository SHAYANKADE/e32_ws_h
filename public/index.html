<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مانیتور قلب</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
    }
    .card h2 { font-size: 18px; color: #555; margin-bottom: 15px; }
    .value { font-size: 48px; font-weight: bold; margin: 10px 0; }
    .unit  { font-size: 16px; color: #888; }
    .bpm-val  { color: #e53935; }
    .spo2-val { color: #1e88e5; }
    .status {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: white;
    }
    .online  { background: #4CAF50; }
    .offline { background: #e53935; }
    .warning { background: #ff9800; }
  </style>
</head>
<body>
  <h1>❤️ مانیتور قلب و اکسیژن</h1>

  <div class="cards">

    <!-- کارت ضربان قلب -->
    <div class="card">
      <h2>💓 ضربان قلب</h2>
      <div class="value bpm-val" id="bpm">--</div>
      <div class="unit">BPM</div>
    </div>

    <!-- کارت اکسیژن خون -->
    <div class="card">
      <h2>🩸 اکسیژن خون</h2>
      <div class="value spo2-val" id="spo2">--</div>
      <div class="unit">درصد</div>
    </div>

  </div>

  <!-- وضعیت اتصال -->
  <div class="status offline" id="statusBox">
    در حال اتصال...
  </div>

  <script>
    async function fetchData() {
      try {
        const res = await fetch('/sensor');
        const data = await res.json();

        // ضربان قلب
        document.getElementById('bpm').innerText =
          data.validBpm ? data.bpm : '--';

        // اکسیژن خون
        document.getElementById('spo2').innerText =
          data.validSpo2 ? data.spo2 : '--';

        // وضعیت
        const box = document.getElementById('statusBox');
        if (!data.validBpm && !data.validSpo2) {
          box.className = 'status warning';
          box.innerText = '⚠️ انگشت رو روی سنسور بذار';
        } else {
          box.className = 'status online';
          box.innerText = '✅ متصل - داده دریافت میشه';
        }

      } catch(e) {
        const box = document.getElementById('statusBox');
        box.className = 'status offline';
        box.innerText = '❌ اتصال قطع شد';
      }
    }

    // هر ۲ ثانیه آپدیت کن
    setInterval(fetchData, 2000);
    fetchData();
  </script>
</body>
</html>
